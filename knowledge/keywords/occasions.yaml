# مناسبت‌های ثابتِ تقویم محتوا. این فایل را می‌توانید ویرایش کنید (مناسبت اضافه/حذف کنید).
# calendar: jalali (روز ثابت شمسی) | hijri (قمری؛ تاریخ میلادی تقریبی است و ۱ تا ۲ روز جابه‌جایی دارد)
